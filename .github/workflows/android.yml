name: Construire APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Trouver et compiler le projet
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ] && [ ! -f settings.gradle ]; then
            echo "ERREUR : settings.gradle introuvable dans le dépôt"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Projet trouvé dans : $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Donner APK
        uses: actions/upload-artifact@v4
        with:
          name: NutriVox-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
